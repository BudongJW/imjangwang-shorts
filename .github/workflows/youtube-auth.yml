name: YouTube 토큰 발급

# 로컬 PC 없이 Actions에서 YouTube OAuth 토큰을 만들어 시크릿에 넣는다.
#
# 이 저장소는 공개(public)다. refresh 토큰은 장기 유효하므로 로그·요약에
# 절대 출력하지 않는다. 발급된 토큰은 gh secret set으로 곧장 시크릿에만 쓴다.
# PAT가 없으면 아무것도 출력하지 않고 실패시킨다.
#
# 필요한 시크릿 3개:
#   GOOGLE_CLIENT_ID          OAuth 클라이언트 ID
#   GOOGLE_CLIENT_SECRET      OAuth 클라이언트 보안 비밀번호
#   YOUTUBE_TOKEN_UPDATE_PAT  repo 권한 PAT (시크릿 쓰기용)
#
# OAuth 클라이언트는 'TV 및 입력 제한 기기' 유형이어야 한다.
# 데스크톱 앱 유형은 기기 흐름(device flow)을 지원하지 않는다.

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "인증 대기 시간(분)"
        type: string
        default: "10"

concurrency:
  group: youtube-auth
  cancel-in-progress: true

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 사전 점검
        env:
          CID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CSEC: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PAT: ${{ secrets.YOUTUBE_TOKEN_UPDATE_PAT }}
        run: |
          miss=""
          [ -z "$CID" ]  && miss="$miss GOOGLE_CLIENT_ID"
          [ -z "$CSEC" ] && miss="$miss GOOGLE_CLIENT_SECRET"
          [ -z "$PAT" ]  && miss="$miss YOUTUBE_TOKEN_UPDATE_PAT"
          if [ -n "$miss" ]; then
            echo "## 시크릿이 없습니다" >> $GITHUB_STEP_SUMMARY
            echo "다음을 먼저 등록하세요:$miss" >> $GITHUB_STEP_SUMMARY
            echo "누락된 시크릿:$miss"; exit 1
          fi
          echo "시크릿 3개 확인됨"

      - name: 기기 코드 요청
        id: device
        env:
          CID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: python scripts/youtube_device_auth.py request

      - name: 인증 대기 및 시크릿 기록
        env:
          CID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CSEC: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.YOUTUBE_TOKEN_UPDATE_PAT }}
          REPO: ${{ github.repository }}
          TIMEOUT_MIN: ${{ github.event.inputs.timeout_minutes || '10' }}
        run: python scripts/youtube_device_auth.py poll
