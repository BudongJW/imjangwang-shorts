name: 영상 삭제·제목변경

# 올린 뒤 제목만 고치거나 영상을 지우는 용도. 사람이 Studio에 들어가지
# 않아도 되게 한다. 에이전트는 실행 권한이 없어 브랜치 푸시로 돌린다.
#
# 브랜치 실행: output/admin_request.json 에 지시를 적고 run/admin-* 푸시
#   {"action": "delete",  "video_id": "xxxx"}
#   {"action": "retitle", "video_id": "xxxx", "title": "새 제목"}
on:
  push:
    branches: ['run/admin-*']
  workflow_dispatch:
    inputs:
      action:
        description: "delete 또는 retitle"
        type: string
        required: true
      video_id:
        description: "영상 ID"
        type: string
        required: true
      title:
        description: "새 제목 (retitle일 때만)"
        type: string

concurrency:
  group: youtube-admin
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-api-python-client python-dotenv

      - name: 지시 읽기
        id: req
        env:
          IN_ACTION: ${{ github.event.inputs.action }}
          IN_VIDEO: ${{ github.event.inputs.video_id }}
          IN_TITLE: ${{ github.event.inputs.title }}
        run: |
          if [ -n "$IN_ACTION" ]; then
            echo "action=$IN_ACTION" >> $GITHUB_OUTPUT
            echo "video_id=$IN_VIDEO" >> $GITHUB_OUTPUT
            printf 'title<<EOF\n%s\nEOF\n' "$IN_TITLE" >> $GITHUB_OUTPUT
            printf 'description<<EOF\n%s\nEOF\n' "" >> $GITHUB_OUTPUT
          else
            f=output/admin_request.json
            [ -f "$f" ] || { echo "$f 가 없습니다"; exit 1; }
            python - <<'PY' >> $GITHUB_OUTPUT
          import json, os
          d = json.load(open("output/admin_request.json", encoding="utf-8"))
          print(f"action={d.get('action','')}")
          print(f"video_id={d.get('video_id','')}")
          print("title<<EOF"); print(d.get("title", "")); print("EOF")
          print("description<<EOF"); print(d.get("description", "")); print("EOF")
          PY
          fi

      - name: 실행
        env:
          CI: true
          PYTHONIOENCODING: utf-8
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_REFRESH_OUT: ${{ github.workspace }}/refreshed_token.json
          ACTION: ${{ steps.req.outputs.action }}
          VIDEO_ID: ${{ steps.req.outputs.video_id }}
          TITLE: ${{ steps.req.outputs.title }}
          DESCRIPTION: ${{ steps.req.outputs.description }}
        run: python scripts/youtube_admin.py

      - name: Rotate YOUTUBE_TOKEN_JSON secret (if refreshed)
        if: always() && hashFiles('refreshed_token.json') != ''
        env:
          GH_TOKEN: ${{ secrets.YOUTUBE_TOKEN_UPDATE_PAT }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "PAT 미설정 - 회전 스킵"; exit 0; }
          gh secret set YOUTUBE_TOKEN_JSON --repo "${{ github.repository }}" < refreshed_token.json
          echo "secret rotated"

      - name: Cleanup token file
        if: always()
        run: rm -f refreshed_token.json
