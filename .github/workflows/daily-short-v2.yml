name: Daily Real-Estate Short
# 파일명 v2 이유: 워크플로를 수동 비활성화(2026-08-24)했다가 재활성화(08-28)한 뒤
# schedule 등록이 살아나지 않아 cron이 3회 연속 미발화(08-28·08-30·08-31).
# disabled 상태는 '워크플로 파일 경로'에 묶인 ID에 저장되므로, 경로를 바꿔
# 새 워크플로로 재등록시켜 스케줄을 되살린다. cron 값·잡 내용은 그대로.

on:
  schedule:
    # cron은 UTC. 목표는 08:30~09:00 KST 게시다(리포트상 08·09시대 게시가
    # 하루당 조회수 중앙값 28회, 10시 이후는 4회 수준 — 7배 차이).
    #
    # GitHub가 예정보다 늦게 띄우는데, 그 지연이 시간대마다 다르다.
    #   예정 00:23 UTC → 지연 261~272분 (09-10~09-12)
    #   예정 19:18 UTC → 지연 128분    (09-13)
    # 처음에는 일정한 오프셋인 줄 알고 그만큼 앞당겼다가 06:26 KST에
    # 떨어졌다. 크론 분으로는 30분짜리 창을 못 맞춘다.
    #
    # 그래서 게시 시각은 크론이 아니라 YouTube 예약 공개로 고정한다
    # (status.publishAt, PUBLISH_TARGET_KST=08:40). 크론은 목표 시각보다
    # 확실히 먼저 돌기만 하면 된다.
    #   01:47 KST 예정 + 지연 최대 실측 272분 = 06:19 KST
    #   목표 08:40 KST까지 2시간 이상 남는다.
    # 정각(HH:00)은 혼잡 1순위라 계속 피한다.
    - cron: '47 16 * * *'   # 16:47 UTC = 01:47 KST (게시는 08:40 KST 예약)
  # 브랜치로도 실행. run/daily-*는 평소대로, 이름에 force가 들어가면
  # 당일 중복 방지 가드를 끄고(지운 영상을 다시 올릴 때), verify가 들어가면
  # 업로드 없이 생성·합성만 한다(렌더링 변경을 영상 올리지 않고 확인할 때).
  push:
    branches: ['run/daily-*']
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "업로드 없이 생성·합성만 (검증용)"
        type: boolean
        default: false
      force:
        description: "당일 중복 업로드 방지 가드 무시 (올린 영상을 지우고 다시 올릴 때)"
        type: boolean
        default: false

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ffmpeg + 한글 폰트(나눔고딕)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-nanum
          sudo fc-cache -f
          ffmpeg -version | head -1
          fc-list | grep -i nanum | head -2 || { echo "NanumGothic missing!"; exit 1; }

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate and upload short
        id: generate
        env:
          CI: true
          PYTHONIOENCODING: utf-8
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_IMAGE_KEY: ${{ secrets.GEMINI_IMAGE_KEY }}
          # AI 배경 생성 ON. 기본값이 0이라 지금껏 generate_background()가
          # 아예 호출되지 않았고, 그래서 장면 회전(253b652)도 무효였다.
          # 키 한도 소진·결제 미설정이면 None을 반환해 기존 배경으로 폴백하므로
          # 켜도 파이프라인이 멈추지는 않는다.
          # 0으로 되돌린다. 켜 둔 동안 매 실행 HTTP 403이 났다(결제 미설정).
          # 켠 이유였던 '썸네일이 매일 똑같다'는 Pexels 배경(날짜별 질의 회전)과
          # 타이틀카드 구도 4종 회전으로 해결됐다. 결제를 켜면 '1'로 되돌린다.
          AI_THUMBNAIL: '0'
          # 시크릿 이름이 PEXELS_KEY로 등록돼 있어 둘 다 받는다.
          PEXELS_API_KEY: ${{ secrets.PEXELS_KEY || secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_REFRESH_OUT: ${{ github.workspace }}/refreshed_token.json
          # force=true면 already_posted_today() 가드를 끈다. 삭제 반영이 늦어
          # 가드가 걸리면 런은 success인데 업로드는 안 되는 조용한 실패가 난다.
          SKIP_IF_POSTED_TODAY: ${{ (github.event.inputs.force == 'true' || contains(github.ref_name, 'force')) && '0' || '1' }}
        run: |
          set +e
          SKIP=""
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ] \
             || [ "${{ contains(github.ref_name, 'verify') }}" = "true" ]; then
            SKIP="--skip-upload"; echo "검증 모드: 업로드 생략"
          fi
          python -m src.orchestrator.main $SKIP
          code=$?
          if [ $code -eq 2 ]; then
            echo "전체 실패(exit 2) — 60초 후 1회 재시도"; sleep 60
            python -m src.orchestrator.main $SKIP
            code=$?
          fi
          exit $code

      # 검증 모드에서만: 렌더 결과를 눈으로 확인할 수 있게 프레임을 뽑아
      # 아티팩트로 올린다. 로컬에는 ffmpeg가 없어 영상 품질을 볼 방법이
      # 이것뿐이다. 업로드는 하지 않으므로 채널에 영향이 없다.
      - name: 검증 프레임 추출
        if: contains(github.ref_name, 'verify')
        run: |
          set -e
          V=output/final/final.mp4
          [ -f "$V" ] || { echo "final.mp4 없음"; exit 1; }
          mkdir -p output/frames
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")
          echo "길이 ${DUR}s"
          # 도입부는 촘촘히(타이틀카드 노출·전환 확인), 이후는 4초 간격.
          # 8장만 뽑던 때는 숫자 콜아웃이 떴는지 아닌지 판정이 안 됐다.
          TIMES="0.2 0.8 1.4 2.0 3.0"
          T=4.0
          while awk -v t="$T" -v d="$DUR" 'BEGIN{exit !(t<d)}'; do
            TIMES="$TIMES $T"
            T=$(awk -v t="$T" 'BEGIN{printf "%.1f", t+4}')
          done
          for T in $TIMES; do
            ffmpeg -v error -ss "$T" -i "$V" -frames:v 1 \
              -vf scale=432:-2 "output/frames/t$(printf '%05.1f' "$T").png"
          done
          ls output/frames | wc -l

      - name: 검증 아티팩트 업로드
        if: contains(github.ref_name, 'verify')
        uses: actions/upload-artifact@v4
        with:
          name: verify-frames
          path: |
            output/frames/*.png
            output/video/title_card.png
          retention-days: 3

      - name: Rotate YOUTUBE_TOKEN_JSON secret (if refreshed)
        if: always() && hashFiles('refreshed_token.json') != ''
        env:
          GH_TOKEN: ${{ secrets.YOUTUBE_TOKEN_UPDATE_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "YOUTUBE_TOKEN_UPDATE_PAT 미설정 - 토큰 회전 스킵"; exit 0
          fi
          gh secret set YOUTUBE_TOKEN_JSON --body "$(cat refreshed_token.json)" --repo "${{ github.repository }}"
          echo "secret rotated"

      - name: Cleanup token file
        if: always()
        run: rm -f refreshed_token.json

      - name: Persist topic history
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f output/topic_history.json ]; then
            git add -f output/topic_history.json
            git diff --cached --quiet || git commit -m "chore: update topic history [skip ci]"
            git push || echo "push 실패(무시)"
          fi
