name: Tests

# 코드를 고칠 때마다 단위 테스트와 지정 대본 회귀 검사를 돌린다.
#
# 대본 사실 검사는 하루에 하나씩 정규식이 늘어나는 구조다. 지금까지는 고친 사람이
# 지난 지정 대본에 손으로 돌려 보고 커밋 메시지에 결과를 적었다. 그 확인을 빠뜨려도
# 알 길이 없었고, 화면 쪽(자막·카드·컷 계획)은 검증 렌더를 눈으로 보는 것 말고는
# 확인할 방법이 없었다.
#
# 데이터만 바뀌는 커밋(토픽 기록·성과 스냅샷)에서는 돌지 않는다.
on:
  push:
    branches: [master, 'claude/**']
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 지정 대본 회귀 검사가 커밋 기록에서 지난 대본을 읽는다.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Lint (문법 오류·없는 이름·안 쓰는 import)
        run: ruff check .

      - name: Unit tests + 지정 대본 회귀 검사
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest
