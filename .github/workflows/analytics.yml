name: Channel Performance Report

# 조회수·시청지속률 리포트. 결과는 Actions 실행 요약(Summary) 탭에 렌더된다.
#
# 매일 스냅샷을 남기는 이유: 누적 조회수만으로는 어제 올린 영상과 한 달 전
# 영상을 비교할 수 없다. 스냅샷 간 차이가 있어야 '지금 도는 영상'을 알 수 있다.
on:
  schedule:
    # 업로드 30분 뒤를 노린다. 업로드 cron과 같은 지연을 받되 두 워크플로의
    # 간격은 유지되는 것을 실측했으므로, 간격만 30분으로 맞춰 둔다.
    - cron: '48 19 * * *'   # 19:48 UTC → 약 09:10 KST
  # 온디맨드 실행용. workflow_dispatch는 API 토큰 권한이 없으면 못 부르므로
  # 브랜치 push로도 돌게 둔다(업로드 워크플로와 같은 방식).
  push:
    branches: ['run/analytics-*']
  workflow_dispatch:
    inputs:
      days:
        description: "Analytics 조회 구간(일)"
        type: string
        default: "30"

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-api-python-client python-dotenv

      - name: Analyze
        id: analyze
        env:
          CI: true
          PYTHONIOENCODING: utf-8
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_REFRESH_OUT: ${{ github.workspace }}/refreshed_token.json
        run: python scripts/analyze_performance.py --days "${{ github.event.inputs.days || '30' }}"

      # 업로드 워크플로와 동일한 토큰 회전. OAuth Testing 모드의 7일 미사용
      # 만료를 막는 효과도 있다.
      - name: Rotate YOUTUBE_TOKEN_JSON secret (if refreshed)
        if: always() && hashFiles('refreshed_token.json') != ''
        env:
          GH_TOKEN: ${{ secrets.YOUTUBE_TOKEN_UPDATE_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "YOUTUBE_TOKEN_UPDATE_PAT 미설정 - 토큰 회전 스킵"; exit 0
          fi
          gh secret set YOUTUBE_TOKEN_JSON --body "$(cat refreshed_token.json)" --repo "${{ github.repository }}"
          echo "secret rotated"

      - name: Cleanup token file
        if: always()
        run: rm -f refreshed_token.json

      # 스냅샷은 반드시 기본 브랜치에 쌓아야 한다. run/analytics-* 브랜치에
      # 커밋하면 그 브랜치와 함께 사라지고, 다음 실행은 master의 옛 스냅샷과
      # 비교하게 돼 '지난 실행 대비 증가'가 어긋난다(2026-09-10 실측).
      - name: Persist snapshot
        if: steps.analyze.outcome == 'success'
        run: |
          set -e
          [ -f output/performance_history.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DEFAULT="${{ github.event.repository.default_branch }}"
          cp output/performance_history.json /tmp/ph.json
          git fetch origin "$DEFAULT"
          git checkout -B "$DEFAULT" "origin/$DEFAULT"
          mkdir -p output && cp /tmp/ph.json output/performance_history.json
          git add -f output/performance_history.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: performance snapshot [skip ci]"
          git push origin "HEAD:$DEFAULT" || echo "push 실패(무시)"
